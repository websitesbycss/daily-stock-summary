# Serves the built single-page app and proxies /api/ to the API container (same origin, so no CORS is needed).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. With the upstream held in a variable, nginx looks the name up again while running, so
    # recreating only the api container does not leave this proxy pointing at its old address.
    resolver 127.0.0.11 valid=10s;

    # The API sets its own security headers; nginx adds none here.
    location /api/ {
        set $api_upstream http://api:8080;
        # A variable without a URI part passes the request URI through unchanged, so /api/... stays /api/....
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Appends the address nginx saw to anything the client sent. The API reads only the last entry, so a
        # client cannot choose its own address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # File names under /assets/ contain a content hash, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Liveness of nginx itself (the API has its own /health, reachable through /api/ only if routed there).
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths get index.html, which must never be cached so a new release is picked up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
