# Included by every location that serves the app. nginx does not inherit add_header into a location that sets its
# own add_header, so the headers live in one snippet instead of being repeated.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Scripts, images, fonts and API calls are limited to this origin. Styles also allow inline rules because the toast
# library injects its stylesheet at runtime; Vite inlines the smallest font files as data: URIs. Scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
