name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, test, packages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

  frontend:
    name: Frontend (format, lint, build, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit (high and critical only)
        run: npm audit --audit-level=high

  containers:
    name: Containers (build and smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build --detach
      - name: Wait for the API behind nginx
        run: |
          # nginx can be up before the .NET process is listening; wait until a request really reaches the API
          # (an invalid symbol is answered with 400 by the API itself, without calling Yahoo).
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/stocks/%21%21%21/daily-summary' || true)
            if [ "$status" = "400" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::The API did not become reachable through nginx (last status: $status)"
          exit 1
      - name: Smoke test through nginx
        run: |
          set -euo pipefail

          # The single-page app is served, with its security headers.
          curl -fsS -D headers.txt http://localhost:8080/ -o index.html
          grep -q '<div id="root">' index.html
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^content-security-policy:' headers.txt

          # An unknown path falls back to the app instead of a 404 (client-side routing).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/some/deep/link)" = "200"

          # nginx proxies /api/ to the API, which validates the symbol itself (no call to Yahoo is needed).
          status=$(curl -s -D api-headers.txt -o problem.json -w '%{http_code}' 'http://localhost:8080/api/stocks/%21%21%21/daily-summary')
          test "$status" = "400"
          grep -q 'urn:daily-stock-summary:problem:invalid-symbol' problem.json
          grep -qi '^x-content-type-options: nosniff' api-headers.txt
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
